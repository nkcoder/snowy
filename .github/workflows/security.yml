name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly-disclosed advisories surface even without a push.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # Go vulnerability scan — fails the build on known advisories affecting code
  # paths actually reachable from this module.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # main.go embeds frontend/dist via go:embed, so the module won't compile
      # (and govulncheck can't load packages) until the frontend is built.
      - name: Build frontend (required for go:embed)
        run: npm ci && npm run build
        working-directory: frontend

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # CodeQL static analysis for Go and JS/TS. build-mode: none analyses source
  # directly, sidestepping the go:embed build requirement.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
