name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number in X.Y.Z format (no leading v), e.g. 1.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate and set version tag
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: version must be in X.Y.Z format (e.g. 1.2.0)"
            exit 1
          fi
          TAG="v${{ github.event.inputs.version }}"
          git fetch --tags
          if git tag | grep -qx "$TAG"; then
            echo "Error: tag $TAG already exists"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        run: wails build -platform darwin/universal

      - name: Package
        run: ditto -c -k --keepParent build/bin/snowy.app snowy-macos.zip

      - name: Tag and release
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            snowy-macos.zip \
            --title "Snowy $TAG" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
