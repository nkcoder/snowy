name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Frontend lint
        run: npm run check
        working-directory: frontend

      - name: Frontend tests
        run: npm run test:coverage
        working-directory: frontend

      - name: Build frontend (required for go:embed)
        run: npm run build
        working-directory: frontend

      - name: Go fmt check
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

      - name: Backend tests with coverage
        run: go test -coverprofile=coverage.out .

      - name: Backend coverage gate (≥80%)
        run: |
          go tool cover -func=coverage.out | \
          awk '/^total:/ { sub(/%/,""); if ($3+0 < 80) { print "FAIL: Go coverage "$3"% < 80%"; exit 1 } }'

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install root deps
        run: npm ci

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npx playwright test
