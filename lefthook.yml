pre-commit:
  parallel: true
  jobs:
    - name: frontend-biome
      root: frontend/
      run: npm run check
    - name: backend-gofmt
      run: test -z "$(gofmt -l .)"
    - name: backend-govet
      run: go vet ./...
    - name: backend-golangci
      run: golangci-lint run

pre-push:
  parallel: true
  jobs:
    - name: frontend-tests
      root: frontend/
      run: npm run test:coverage
    - name: backend-tests
      run: >-
        go test -coverprofile=coverage.out . &&
        go tool cover -func=coverage.out |
        awk '/^total:/ { sub(/%/,""); if ($3+0 < 80) { print "FAIL: Go coverage "$3"% < 80%"; exit 1 } }'
